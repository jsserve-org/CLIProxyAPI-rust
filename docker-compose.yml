services:
  cliproxyapi-rs:
    build: .
    restart: unless-stopped
    ports:
      - "8317:8317"
      - "127.0.0.1:8318:8318"
    volumes:
      - ./config.yaml:/etc/cliproxyapi/config.yaml:ro
      - ${CLIPROXY_AUTH_DIR:-./auth}:/home/nonroot/.cli-proxy-api
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 128m
    cpus: 1.0

