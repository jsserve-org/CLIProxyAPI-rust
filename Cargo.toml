[package]
name = "cliproxyapi-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A resource-conscious Rust core compatible with CLIProxyAPI"

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = { version = "0.8", features = ["http2", "multipart", "ws"] }
bcrypt = "0.17"
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
http = "1.3"
lru = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal", "fs", "net", "sync", "time"] }
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tiktoken-rs = "0.12"
humantime = "2.3"
url = "2.5"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
