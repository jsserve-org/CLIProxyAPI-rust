# Internet-facing API-only listener. Put TLS and rate limiting in front of this.
host: 0.0.0.0
port: 8317

# API + management listener. Keep this on loopback or a private VPN interface.
admin-host: 127.0.0.1
admin-port: 8318

auth-dir: ~/.cli-proxy-api
api-keys:
  - replace-with-a-long-random-public-api-key

remote-management:
  secret-key: replace-with-a-different-long-random-management-key

max-concurrency: 64
max-body-bytes: 16777216
upstream-timeout-seconds: 600
request-retry: 2
routing:
  strategy: round-robin
  session-affinity: true
  session-affinity-ttl: 1h
  session-affinity-subagents: true
upstream-url: https://chatgpt.com/backend-api/codex
# Gemini-compatible API credentials. These are forwarded to /v1beta routes.
# gemini-api-key:
#   - api-key: replace-with-gemini-key
#     base-url: https://generativelanguage.googleapis.com
# interactions-api-key:
#   - api-key: replace-with-gemini-interactions-key
gemini-upstream-url: https://generativelanguage.googleapis.com
usage-statistics-enabled: false
redis-usage-queue-retention-seconds: 60
proxy-url: ""

# Credential/model cooldowns. Quota (429), auth (401/403) and transient (5xx)
# failures park a credential so later requests skip it until it recovers.
# disable-cooling turns this off; transient-error-cooldown-seconds overrides the
# 60s default (negative disables transient cooldowns only).
disable-cooling: false
transient-error-cooldown-seconds: 0

quota-exceeded:
  switch-project: false
  switch-preview-model: false

# Auto backtracking: when a model's credentials are all cooling (quota) or the
# upstream keeps failing, retry on the next weaker model. `default` applies when
# no exact rule matches.
model-fallback:
  gpt-5.6-sol:
    - gpt-5.6-terra
    - gpt-5.6-luna
  gpt-5.6-terra:
    - gpt-5.6-luna
  default:
    - gpt-5.6-luna

# GitHub Copilot provider. Runs the GitHub device-code flow, exchanges the
# GitHub token for a Copilot session token, stores type:"copilot" auth files,
# and routes the models listed below to api.githubcopilot.com. Leave `models`
# empty to keep Copilot routing disabled.
copilot:
  enabled: false
  client-id: Iv1.b507a08c87ecfe98
  scope: read:user
  upstream-url: https://api.githubcopilot.com
  models: []

# OpenAI-compatible upstreams. A chat/completions request for one of these
# models is forwarded with the provider's key; the next key is tried when one
# fails. `alias` is the name clients use (defaults to `name`). Gemini works
# through its OpenAI endpoint.
openai-compatibility: []
#  - name: gemini
#    base-url: https://generativelanguage.googleapis.com/v1beta/openai
#    api-key-entries:
#      - api-key: replace-with-a-provider-key
#    models:
#      - name: gemini-3-pro
#        alias: gemini

# Anthropic API keys. A /v1/messages request for one of these models goes to
# Anthropic (or `base-url`) untranslated.
claude-api-key: []
#  - api-key: replace-with-an-anthropic-key
#    models:
#      - name: claude-opus-5-5

# Extra client-facing names for Codex models, and Codex models to hide
# (`*` is a wildcard). Only the `codex` entry is applied.
oauth-model-alias: {}
#  codex:
#    - name: gpt-5.6-sol
#      alias: best
oauth-excluded-models: {}
#  codex: ["*-spark"]

# The management api-call endpoint is an SSRF capability. Only these HTTPS
# destinations are accepted. Add an exact provider hostname if you need it.
management-allowed-hosts:
  - chatgpt.com
  - api.openai.com
  - api.anthropic.com
  - api.x.ai
